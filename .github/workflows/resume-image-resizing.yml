# Turns Vercel's image resizing back on once the free allowance has reset.
#
# Resizing is paused until the date in src/lib/image-resizing.ts, and next.config
# only reads that date when the site is built. So after the date, production
# needs one fresh build. This pushes an empty commit to main, which Vercel
# deploys like any merge. If anything has been merged since the date, that
# merge already rebuilt the site and this does nothing.
#
# Three chances on the day, because GitHub sometimes delays or drops scheduled
# runs. Once it has worked, this file and src/lib/image-resizing.ts can go.

name: Resume image resizing

on:
  schedule:
    - cron: "30 15,21 20 10 *" # 20 Oct, 15:30 and 21:30 UTC
    - cron: "30 9 21 10 *" # 21 Oct, 09:30 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Push the rebuild commit now, even before the date (to test that it reaches Vercel)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild production if it hasn't been built since the date
        env:
          FORCE: ${{ inputs.force }}
        run: |
          file=src/lib/image-resizing.ts
          if [ ! -f "$file" ]; then
            echo "$file is gone, so the pause has been removed. Nothing to do."
            exit 0
          fi

          until=$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]+Z' "$file" | head -1)
          until_s=$(date -u -d "$until" +%s)
          last_s=$(git log -1 --format=%ct)

          if [ "$FORCE" != "true" ]; then
            if [ "$(date -u +%s)" -lt "$until_s" ]; then
              echo "Resizing is paused until $until. Too early."
              exit 0
            fi
            if [ "$last_s" -ge "$until_s" ]; then
              echo "main has had a commit since $until, so it was already rebuilt."
              exit 0
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Rebuild so image resizing turns back on" \
            -m "The pause in $file ended at $until. next.config reads it at build time, so this empty commit gives Vercel a reason to build."
          git push
